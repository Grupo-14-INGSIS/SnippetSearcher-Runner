spring:
  application:
    name: snippet-searcher-runner
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

redis:
  streams:
    # App -> Runner: trabajos de linteo/formateo. Runner -> App: resultados.
    jobs: "snippet-jobs"
    jobs-group: "runner_group"
    results: "snippet-job-results"
    # XADD con MAXLEN ~ : el stream guarda historial pero recortado
    max-length: 10000
    # Cada cuánto se reintentan los mensajes que quedaron sin ACK (réplica caída, error transitorio)
    reclaim-interval-ms: 30000

app:
  bucket:
    url: http://${BUCKET_SERVICE}:${BUCKET_PORT}
  app:
    url: http://${APP_HOST}:${APP_PORT}

server:
  port: 8080

logging:
  pattern:
    console: "[%X{request_id}] %d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    com.grupo14IngSis.snippetSearcherRunner: DEBUG