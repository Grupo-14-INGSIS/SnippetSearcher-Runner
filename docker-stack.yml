version: '3.8'

services:
  snippetsearcher-runner:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-runner:${IMAGE_TAG:?falta IMAGE_TAG}
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:?falta NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}

      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -XX:TieredStopAtLevel=1
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: snippet-db
      DB_HOST: runner-db
      DB_PORT: 5432

      BUCKET_SERVICE: asset-service
      BUCKET_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379


    entrypoint:
      - bash
      - -c
      - |
        until bash -c "</dev/tcp/$$DB_HOST/$$DB_PORT" 2>/dev/null; do sleep 2; done
        sleep 5
        exec java -javaagent:/usr/local/newrelic/newrelic.jar -jar /app/app.jar


    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 900s

    networks: [ default, snippetsearcher-net ]
    deploy:
      replicas: 2
      restart_policy: { condition: any, delay: 10s }
      update_config: { parallelism: 1, delay: 10s, order: start-first, failure_action: rollback, monitor: 60s }

  runner-db:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: snippet-db }
    volumes:
      - runner-pgdata:/var/lib/postgresql/data

networks:
  snippetsearcher-net: { external: true }

volumes:
  runner-pgdata: { name: snippetsearcher_runner-pgdata }
