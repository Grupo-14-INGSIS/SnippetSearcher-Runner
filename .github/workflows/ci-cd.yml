name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run ktlintFormat
        run: |
          CHANGES_BEFORE=$(git diff --name-only)
          ./gradlew ktlintFormat --quiet
          CHANGES_AFTER=$(git diff --name-only)
          if [ "$CHANGES_BEFORE" != "$CHANGES_AFTER" ]; then
            echo "Build bloqueado: ktlintFormat modificó archivos."
            exit 1
          fi

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --quiet

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew test --continue > .git/test-output.log
          if grep -q "FAILED" .git/test-output.log; then
            echo "Build bloqueado: fallaron tests."
            cat .git/test-output.log | grep FAILED
            exit 1
          fi

      - name: Verify coverage
        run: |
          if ! ./gradlew jacocoTestCoverageVerification --quiet; then
            echo "Build blocked: code coverage below required threshold."
            ./gradlew jacocoTestReport
            exit 1
          fi

      - name: Build
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci-cd
    outputs:
      image_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Store new image version
        id: version
        run: echo "version=${{ github.ref_name }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/grupo-14-ingsis/snippetsearcher-runner:${{ github.ref_name }}
            ghcr.io/grupo-14-ingsis/snippetsearcher-runner:${{ steps.version.outputs.version }}
          build-args: |
            GITHUB_USERNAME=${{ github.repository_owner }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

  update-infra:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Grupo-14-INGSIS/SnippetSearcher-Infrastructure
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}
          path: infrastructure

      - name: Update image version
        env:
          IMAGE_VERSION: ${{ needs.build-and-push.outputs.image_version }}
          IMAGE: ghcr.io/grupo-14-ingsis/snippetsearcher-runner
          BRANCH: ${{ github.ref_name }}
          COMPOSE_FILE: "docker-stack.yml"
        run: |
          set -euo pipefail
          
          cd infrastructure
          
          if ! grep -Eq "^[[:space:]]*image:[[:space:]]*${IMAGE}:" "$COMPOSE_FILE"; then
            echo "ERROR: Couldn't find image $IMAGE in $COMPOSE_FILE"
            exit 1
          fi
          
          sed -i -E \
            "s#(^[[:space:]]*image:[[:space:]]*${IMAGE}:)[^[:space:]]+#\1${IMAGE_VERSION}#" \
            "$COMPOSE_FILE"
          
          if ! grep -Fq "${IMAGE}:${IMAGE_VERSION}" "$COMPOSE_FILE"; then
            echo "ERROR: Could not successfully update the version"
            exit 1
          fi
          
          if git diff --quiet -- "$COMPOSE_FILE"; then
            echo "Version was already updated; no changes required."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "$COMPOSE_FILE"
          git commit -m "chore: update Docker image ${IMAGE} to ${IMAGE_VERSION}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"